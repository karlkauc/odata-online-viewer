[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odata-online-viewer"
version = "0.1.0"
description = "OData Online Viewer: visualize OData $metadata (V2, V3, V4) as tree, ER diagram and source, and explore entity sets."
requires-python = ">=3.11"
authors = [{ name = "Karl Kauc" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "lxml>=5.3,<7",
    "pydantic>=2.8",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "psycopg[binary]>=3.2",
    "geoip2>=4.8",
    "XlsxWriter>=3.2",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.odata.samples" = ["*.xml", "*.json"]
"app.content" = ["template.html", "faq.toml", "pages/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Inline XML/JSON fixtures are more readable on one line.
"tests/*" = ["E501"]

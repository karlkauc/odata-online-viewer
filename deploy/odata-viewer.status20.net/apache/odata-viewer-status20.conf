# Local test instance of the OData Online Viewer behind the host Apache,
# mirroring xml-viewer.status20.net. The container (docker-compose.yml in the
# repo root) listens on 127.0.0.1:8094 only.
#
# Install:
#   sudo cp deploy/odata-viewer.status20.net/apache/odata-viewer-status20.conf /etc/apache2/sites-available/
#   sudo a2ensite odata-viewer-status20 && sudo systemctl reload apache2
#   sudo certbot --apache -d odata-viewer.status20.net --redirect
# certbot writes odata-viewer-status20-le-ssl.conf (this vhost plus the
# certificate lines) and turns this one into an https redirect.

<VirtualHost *:80>
    ServerName odata-viewer.status20.net

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8094/
    ProxyPassReverse / http://127.0.0.1:8094/

    # Tell the backend the original scheme/port so uvicorn's --proxy-headers
    # produces correct request URLs and the rate-limiter sees the real client IP.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # Metadata uploads. Keep above MAX_UPLOAD_MB on the backend.
    LimitRequestBody 104857600

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
        Header always set Content-Security-Policy "frame-ancestors 'none'"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/odata-viewer-status20-error.log
    CustomLog ${APACHE_LOG_DIR}/odata-viewer-status20-access.log combined
</VirtualHost>
